{% extends "base.html" %}

{% block content %}
<div class="form-container" style="max-width: 480px; margin-top: 2rem;">
  <div class="form-header">
    <h2 class="form-title">Login to PocketSmart AI</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem;">Enter your registered credentials to access your dashboard.</p>
  </div>

  <form id="login-form">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" required placeholder="name@example.com">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In →</button>
  </form>

  <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
    Don't have an account? <a href="/register">Create Account</a>
  </p>
</div>
{% endblock %}
